# Releases are immutable once published, so everything attached to one - the zip Marketplace installs from (hacs.json
# zip_release), and the wheel and source tarball PyPI gets - has to be attached while it's still a draft. Write the
# release as a draft in GitHub as usual, with its notes and whether it's a pre-release, then run this from the Actions
# tab with its tag: it builds and attests the files, attaches them, publishes the release, and then has
# pypi-publish.yml publish those same files - to PyPI, or to TestPyPI for a pre-release.
#
# pypi-publish.yml is started from here rather than by the release being published, as a release published with this
# workflow's token starts no other workflow; and it stays a workflow of its own, as PyPI's trusted publisher names it.

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release, such as v0.8.0"
        required: true
        type: string

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      # write, as only a token that can push sees draft releases - nothing is written here
      contents: write
    outputs:
      ref: ${{ steps.draft.outputs.ref }}
    steps:
    - name: Find the draft release
      id: draft
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
        if [ "$(jq -r .isDraft <<<"$release")" != "true" ]; then
          echo "::error::$TAG is already published, and a published release can't have files added. Draft a new release."
          exit 1
        fi
        # a tag chosen as new in the draft isn't made till the release is published, so till then the draft's
        # target is what's released
        if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" >/dev/null; then
          ref="refs/tags/$TAG"
        else
          ref=$(jq -r .targetCommitish <<<"$release")
        fi
        echo "Releasing $TAG from $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      # to check out the release's source
      contents: read
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.draft.outputs.ref }}
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.14"

    - name: Package release zip
      run: |
        mkdir release
        cd custom_components/ha_repl_server
        zip -r "$GITHUB_WORKSPACE/release/ha_repl_server.zip" . -x "__pycache__/*" "*/__pycache__/*"

    - name: Build a binary wheel and a source tarball
      run: uv build --out-dir release

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/*

    - name: Keep the files for the release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # to attach the files to the draft and publish it
      contents: write
      # to start pypi-publish.yml
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: release/

    - name: Attach the files to the draft
      run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

    - name: Publish
      run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

    - name: Publish to PyPI
      run: gh workflow run pypi-publish.yml --ref "$TAG" -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
