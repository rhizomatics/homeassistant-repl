# Releases homeassistant-repl when a version tag (v0.15.1, v0.16.0-beta1) is pushed - see
# policies/release_workflows.md in rhizomatics/hq. CI runs on the tag, then everything attached to the release - the
# zip Marketplace installs from (hacs.json zip_release), and the wheel and source tarball PyPI gets - is built and
# attested, and the GitHub release is published with them and the version's CHANGELOG.md notes. Releases are
# immutable, so nothing can be added once one is published. Last, pypi-publish.yml publishes those same files - to
# PyPI, or to TestPyPI for a pre-release.
#
# pypi-publish.yml is started from here rather than by the release being published, as a release published with a
# workflow's token starts no other workflow; and it stays a workflow of its own, as PyPI's trusted publisher names it.

name: Publish Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/python-package.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.14"
        # nothing cached is used to build what's released
        enable-cache: false

    - name: Package release zip
      run: |
        mkdir release
        cd custom_components/ha_repl_server
        zip -r "$GITHUB_WORKSPACE/release/ha_repl_server.zip" . -x "__pycache__/*" "*/__pycache__/*"

    - name: Build a binary wheel and a source tarball
      run: uv build --out-dir release

    - name: Checksums
      run: |
        cd release
        sha256sum ha_repl_server.zip > ha_repl_server.zip.sha256

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/*

    - name: Keep the files for the release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: release/

  github-release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      artifact: release

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      # only to start pypi-publish.yml, in a job with no other steps or actions
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
    - name: Publish to PyPI
      run: gh workflow run pypi-publish.yml --ref "$TAG" -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
