# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Github Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      # docs group: ty also checks docs_hooks, which imports properdocs; extras: sql.py imports polars and pandas
      - name: Install dependencies
        run: |
          uv sync --all-extras --group docs --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy --explicit-package-bases --follow-untyped-imports src custom_components

      - name: ty
        run: uv run ty check

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
       
    - name: Ruff
      uses:  astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
    - name: Test with pytest
      run: uv run pytest tests
    - name: Build a binary wheel and a source tarball
      run: uv build
    # Publishing steps: on main only, never from a pull request's merge ref.
    - name: Generate badges
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        if ! git clone --single-branch --branch badges "$REMOTE_URL" . 2>/dev/null; then
          # First run: the badges branch doesn't exist on the remote yet.
          git init
          git remote add origin "$REMOTE_URL"
          git checkout --orphan badges
        fi
        cp -r ${{ github.workspace }}/badges .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: ProperDocs
      if: github.event_name == 'push'
      run:  |
        git pull
        uv sync --dev --group docs
        sudo apt-get install pngquant
        export HTMLPROOFER_EXT_URLS=True
        uv run properdocs gh-deploy

  # The build job tests the locked Home Assistant; this tests the oldest supported (hacs.json,
  # 2026.8 by policy exception) and the newest
  test-ha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "2026.8"
            ha-override: "2026.8.*"
          - ha-version: "2026.11"
            ha-override: "2026.11.*"
            # Home Assistant's own test package, replacing pytest-homeassistant-custom-component from 2026.11
            ha-test-package: pytest-homeassistant

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # --no-config keeps the [tool.uv] settings in pyproject.toml out of this resolve. The test
      # harness has to move with homeassistant, as it is built against one HA release: Home
      # Assistant's own pytest-homeassistant from 2026.11, pytest-homeassistant-custom-component
      # before that (see tests/ha_testing.py)
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        run: |
          uv pip uninstall pytest-homeassistant pytest-homeassistant-custom-component
          if [ "${{ matrix.ha-test-package }}" = "pytest-homeassistant" ]; then
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" "pytest-homeassistant==${{ matrix.ha-override }}"
          else
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          fi
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: Test with pytest
        run: uv run --no-sync pytest tests

  # The one check branch protection requires, so the jobs above can change without
  # editing the required status checks.
  ci-ok:
    if: always()
    needs: [typecheck, build, test-ha]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
