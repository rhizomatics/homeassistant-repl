# Type checks, lint and tests, with a read-only token, so release.yml can run it on a tag. Badges and docs are
# published from main by docs.yml, the one workflow here that writes to the repo.

name: Github Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # release.yml runs this on the tag before building
  workflow_call:

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # docs group: ty also checks docs_hooks, which imports properdocs; extras: sql.py imports polars and pandas
      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv sync --all-extras --group docs --python "$PYTHON_VERSION"

      - name: mypy
        run: uv run mypy --explicit-package-bases --follow-untyped-imports src custom_components

      - name: ty
        run: uv run ty check

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
    - name: Test with pytest
      run: uv run pytest tests
    - name: Build a binary wheel and a source tarball
      run: uv build

  # The build job tests the locked Home Assistant; this tests the oldest supported (hacs.json,
  # 2026.8 by policy exception) and the newest
  test-ha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "2026.8"
            ha-override: "2026.8.*"
          - ha-version: "2026.11"
            ha-override: "2026.11.*"
            # Home Assistant's own test package, replacing pytest-homeassistant-custom-component from 2026.11
            ha-test-package: pytest-homeassistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # --no-config keeps the [tool.uv] settings in pyproject.toml out of this resolve. The test
      # harness has to move with homeassistant, as it is built against one HA release: Home
      # Assistant's own pytest-homeassistant from 2026.11, pytest-homeassistant-custom-component
      # before that (see tests/ha_testing.py)
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        env:
          HA_VERSION: ${{ matrix.ha-version }}
          HA_OVERRIDE: ${{ matrix.ha-override }}
          HA_TEST_PACKAGE: ${{ matrix.ha-test-package }}
        run: |
          uv pip uninstall pytest-homeassistant pytest-homeassistant-custom-component
          if [ "$HA_TEST_PACKAGE" = "pytest-homeassistant" ]; then
            uv pip install --no-config "homeassistant==$HA_OVERRIDE" "pytest-homeassistant==$HA_OVERRIDE"
          else
            uv pip install --no-config "homeassistant==$HA_OVERRIDE" pytest-homeassistant-custom-component
          fi
          uv run --no-sync python -c "import os, homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith(os.environ['HA_VERSION'] + '.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: Test with pytest
        run: uv run --no-sync pytest tests

  # The one check branch protection requires, so the jobs above can change without
  # editing the required status checks.
  ci-ok:
    if: always()
    needs: [typecheck, build, test-ha]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
