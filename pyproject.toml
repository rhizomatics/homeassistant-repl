[project]
name = "homeassistant-repl"
version = "0.13.0"
description = "Home Assistant REPL - the powerful developer shell for custom component developers"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant-api>=6.1.0",
    "nanoarrow>=0.9.0",
    "niquests[ws]>=3.21.0",
    "prompt-toolkit>=3.0",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Debuggers",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14"
]

[project.optional-dependencies]
# For homeassistant_repl.sql.SqlResult.to_polars()/.to_pandas() - installed
# into whichever Python actually runs that code. Since sql() downloads a
# complete result as Arrow and hands it to *this* package's own SqlResult
# (not custom_components/ha_repl_server's - the two share nothing but the
# Arrow bytes; see sql.py's own module docstring) to render/convert
# locally, that's always this project's own venv, never Home Assistant's -
# installing it is a `uv pip install`/`pyproject.toml` edit here, not a
# manifest.json change to the running instance. Floors are the earliest
# release with a Python 3.14 wheel, not just the earliest with the feature
# this module relies on (polars' Arrow PyCapsule-based
# DataFrame-from-dict-of-arrays support is actually a little older, from
# 1.3.0) - an older pin would just fall back to a slow/failing source build
# on this project's own `requires-python`.
polars = ["polars>=1.3.0"]
pandas = ["pandas>=2.3.3"]

[project.scripts]
ha-repl = "homeassistant_repl.cli:main"

[dependency-groups]
dev = [
    "homeassistant>=2026.8.0",
    "types-Pygments",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist",
    "pytest-timeout",
    "coverage",
    "icdiff",
    "genbadge[all]",
    "actionlint-py",
    "codespell",
    "mypy",
    "types-PyYAML",
    "niquests-mock>=0.5.1,<0.6.0",
    "nanoarrow>=0.9.0",
    "sqlparse>=0.5.0",
]
docs=[
    "properdocs",
    "mkdocs-materialx",
    "mkdocs-minify-plugin",
    "mkdocs-autorefs",
    "mkdocs-pagetree-plugin",
    "mkdocs-coverage",
    "termynal",
    "mkdocs-homepage-copier",
    "pymdown-extensions",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-llmstxt>=0.5.0,<0.6.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
compile-bytecode = true
managed = true
prerelease = "disallow"
exclude-newer = "7 days"
exclude-newer-package = {certifi=false, "uv_build"="2 days",homeassistant_repl=false,uv=false}
add-bounds = "major"
# Home Assistant pins uv exactly, and under `uv run` the venv's uv comes first on PATH,
# shadowing the mise-managed one. Floor at the latest uv security fix (GHSA-hq85-5cpj-mr62).
override-dependencies = ["uv>=0.13.4"]

[tool.uv.build-backend]
module-root = "src"
module-name = "homeassistant_repl"


[tool.ruff.lint]
preview = true
unfixable = ["B"]


[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    "templates",
]
addopts = [
    "--timeout=30",
    "--junitxml=junit/test-results.xml",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components/ha_repl_server",
    "--cov=src",
    "--cov-fail-under=45",  # TODO: raise back towards 90 once hass-backed tests land
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under=0

[tool.coverage.xml]
output="cov.xml"

[tool.coverage.html]
directory="htmlcov"

[tool.mypy]
mypy_path = "src"

[tool.codespell]
skip = ".venv,.git,htmlcov,site/**,./.*,*.csv,*.json,README.*.md,support"
count = true
quiet-level = 2
ignore-words-list="hass,referer"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", # asserts are ok
        "B311"] # RNGs not used for security

[project.urls]
Homepage="https://homeassistant-repl.rhizomatics.org.uk"
Repository="https://github.com/rhizomatics/homeassistant-repl"
Documentation="https://homeassistant-repl.rhizomatics.org.uk"
Issues="https://github.com/rhizomatics/homeassistant-repl/issues"
Changelog="https://github.com/rhizomatics/homeassistant-repl/blob/main/CHANGELOG.md"
