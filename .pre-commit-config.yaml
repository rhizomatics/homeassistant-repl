repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Check for merge-conflicts
      - id: check-yaml
        name: Check for un-parseable yaml
        args: [--allow-multiple-documents]
        exclude: properdocs.yml
      - id: check-executables-have-shebangs
        name: Check shell script for shebang lines
      - id: check-shebang-scripts-are-executable
        name: Check shell scripts are executable
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock
        # Lock as CI does, without ~/.config/uv/uv.toml: its settings (an
        # `exclude-newer-package` entry, say) are otherwise written into
        # uv.lock, which `uv sync --locked` then rejects anywhere else.
        entry: env XDG_CONFIG_HOME=/dev/null uv lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
     # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.0'
    hooks:
      - id: mypy
        args:
          - --pretty
          - --explicit-package-bases
          - --show-error-codes
          - --show-error-context
          - --follow-untyped-imports
        exclude: docgen/.*\.py
        additional_dependencies:
          - homeassistant-stubs
          - pytest
          - rich
          - nanoarrow
          - sqlparse
          - types-PyYAML
          - prompt_toolkit
          - niquests[ws]
          - homeassistant_api
          - properdocs
          - types-PyYAML
          - types-Pygments
          - pytest_unordered
          - pytest_mock
          - pytest-homeassistant-custom-component
 
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.86
    hooks:
      - id: ty

ci:
    autofix_commit_msg: |
        [pre-commit.ci] auto fixes from pre-commit.com hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_branch: ''
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip:
      - bandit
      - mypy
    submodules: false
