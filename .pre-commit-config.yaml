# Run Python hooks on 3.14, the only version this project supports, as the other HA repos do.
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Check for merge-conflicts
      - id: check-yaml
        name: Check for un-parseable yaml
        args: [--allow-multiple-documents]
        exclude: properdocs.yml
      - id: check-executables-have-shebangs
        name: Check shell script for shebang lines
      - id: check-shebang-scripts-are-executable
        name: Check shell scripts are executable
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
        # Lock as CI does, without ~/.config/uv/uv.toml: its settings (an
        # `exclude-newer-package` entry, say) are otherwise written into
        # uv.lock, which `uv sync --locked` then rejects anywhere else.
        entry: env XDG_CONFIG_HOME=/dev/null uv lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
     # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.1'
    hooks:
      - id: mypy
        args:
          - --pretty
          - --explicit-package-bases
          - --show-error-codes
          - --show-error-context
          - --follow-untyped-imports
        exclude: docgen/.*\.py
        additional_dependencies:
          - homeassistant-stubs
          - pytest
          - rich
          - nanoarrow
          - sqlparse
          - types-PyYAML
          - prompt_toolkit
          - jedi
          - niquests[ws]
          - homeassistant_api
          - properdocs
          - types-PyYAML
          - types-Pygments
          - pytest_unordered
          - pytest_mock
          - pytest-homeassistant-custom-component
 
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
      - id: ty
